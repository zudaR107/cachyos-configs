# Lint workflow for cachyos-configs.
# Location: .github/workflows/lint.yml

name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fish shellcheck yamllint curl
          npm install --silent --no-save --no-package-lock jsonc-parser

      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.11"
          curl -sSLo /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Validate JSON and TOML
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          import sys
          from pathlib import Path

          try:
              import tomllib  # py3.11+
          except Exception as e:
              print(f"tomllib not available: {e}", file=sys.stderr)
              sys.exit(1)

          ROOT = Path(".").resolve()
          SKIP_DIRS = {".git", "node_modules"}

          def iter_files(ext: str):
              for p in ROOT.rglob(f"*{ext}"):
                  if any(part in SKIP_DIRS for part in p.parts):
                      continue
                  if not p.is_file():
                      continue
                  yield p

          errors = 0

          # Strict JSON
          for p in iter_files(".json"):
              try:
                  json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  errors += 1
                  print(f"[json] {p}: {e}")

          # TOML parse check
          for p in iter_files(".toml"):
              try:
                  tomllib.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  errors += 1
                  print(f"[toml] {p}: {e}")

          if errors:
              print(f"Failed: {errors} file(s)")
              sys.exit(1)

          print("OK: JSON and TOML")
          PY

      - name: Validate JSONC
        run: |
          node - <<'JS'
          const fs = require("fs");
          const path = require("path");
          const { parse, ParseErrorCode } = require("jsonc-parser");

          const ROOT = process.cwd();
          const SKIP = new Set([".git", "node_modules"]);

          function* walk(dir) {
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              if (SKIP.has(ent.name)) continue;
              const p = path.join(dir, ent.name);
              if (ent.isDirectory()) yield* walk(p);
              else yield p;
            }
          }

          const files = [];
          for (const p of walk(ROOT)) {
            if (p.endsWith(".jsonc")) files.push(p);
          }

          let errors = 0;

          for (const p of files) {
            const text = fs.readFileSync(p, "utf8");
            const parseErrors = [];
            parse(text, parseErrors, { allowTrailingComma: true });

            if (parseErrors.length) {
              errors++;
              console.error(`[jsonc] ${p}`);
              for (const err of parseErrors) {
                const code = ParseErrorCode[err.error] ?? err.error;
                console.error(`  - offset=${err.offset} length=${err.length} error=${code}`);
              }
            }
          }

          if (errors) process.exit(1);
          console.log(`OK: JSONC (${files.length} file(s))`);
          JS

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          actionlint

      - name: Lint YAML
        shell: bash
        run: |
          set -euo pipefail
          yamllint -d "$(cat <<'YAML'
          extends: default
          rules:
            line-length: disable
            comments: disable
            comments-indentation: disable
            document-start: disable
          YAML
          )" .github/workflows

      - name: Lint Fish (syntax)
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            echo "==> $f"
            fish -n "$f"
          done < <(find fish -name '*.fish' -print0)

      - name: Lint Shell scripts (if present)
        shell: bash
        run: |
          set -euo pipefail
          if ls scripts/*.sh >/dev/null 2>&1; then
            shellcheck scripts/*.sh
            bash -n scripts/*.sh
          else
            echo "No scripts/*.sh found, skipping."
          fi

      - name: Whitespace, line endings and final newline
        run: |
          python - <<'PY'
          from __future__ import annotations
          import sys
          from pathlib import Path

          ROOT = Path(".").resolve()
          SKIP_DIRS = {".git", "node_modules"}

          def is_skipped(p: Path) -> bool:
              return any(part in SKIP_DIRS for part in p.parts)

          bad = 0
          for p in ROOT.rglob("*"):
              if is_skipped(p) or not p.is_file():
                  continue
              try:
                  data = p.read_bytes()
              except Exception:
                  continue
              if b"\x00" in data:
                  continue

              text = data.decode("utf-8", errors="strict")

              if len(data) > 0 and not data.endswith(b"\n"):
                  bad += 1
                  print(f"[eof] {p}: missing final newline")

              if "\r\n" in text or "\r" in text:
                  bad += 1
                  print(f"[eol] {p}: contains CRLF/CR")

              if p.suffix.lower() != ".md":
                  for i, line in enumerate(text.split("\n"), start=1):
                      if line.endswith(" ") or line.endswith("\t"):
                          bad += 1
                          print(f"[ws] {p}:{i}: trailing whitespace")
                          break

          if bad:
              print(f"Failed: {bad} issue(s)")
              sys.exit(1)

          print("OK: whitespace / EOL / EOF newline")
          PY